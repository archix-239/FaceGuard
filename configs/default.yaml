models:
  emotion_model_path: models/faceguard_best_model_Version_25-065Epochs.keras
  face_landmarker_path: models/face_landmarker.task

emotion:
  classes:
    - ANGRY
    - CONTEMPT
    - DISGUST
    - FEAR
    - HAPPY
    - NEUTRAL
    - SAD
    - SURPRISE
  preds_buffer_maxlen: 15

camera:
  index: 0
  width: 1280
  height: 720

asymmetry:
  threshold: 20

threat:
  angry_contempt_bonus: 60
  fear_bonus: 30

clahe:
  clip_limit: 2.5
  tile_grid_size: [8, 8]

ui:
  mode: full
  window_name: FaceGuard V2.0 - Edition Industrielle

runtime:
  outdir: runs
  max_seconds: null
  metrics_filename: metrics.jsonl
  video_filename: video.mp4
  emotion_only_mode: true

inference:
  fps: 8.0
  backend: keras
  tflite_model_path: models/faceguard_fp32.tflite
  tflite_num_threads: 4
  warmup_runs: 3
  max_faces_per_batch: 3

work_frame:
  enabled: true
  width: 640
  height: 360

tracking:
  enabled: true
  max_faces: 4
  detect_every_ms: 400
  detect_every_n_frames: 15
  tracker_type: MOSSE
  max_missed_frames: 30
  ttl_ms: 5000
  dedup_iou_threshold: 0.5
  min_redetect_interval_ms: 400
  track_health:
    max_center_jump_px: 80
    max_area_ratio: 2.5
    min_area_ratio: 0.4
    max_oob_ratio: 0.2
    max_missed_detects_before_redetect: 3
  match:
    iou_min: 0.10
    dist_max_norm: 0.5
    size_penalty_weight: 0.2
  reacquire:
    grace_ms: 3000
    multiplier: 2.0

window:
  window_ms: 60000
  features_hz: 1
  min_valid_ratio: 0.3

fsm:
  enabled: true
  min_dwell_ms:
    calm: 2000
    suspect: 3000
    threat: 5000
  thresholds:
    suspect_enter:
      threat_mean_min: 20
      neg_ratio_min: 0.20
      motion_p95_min: 0.10
    suspect_exit:
      threat_mean_max: 12
      neg_ratio_max: 0.12
      motion_p95_max: 0.08
    threat_enter:
      threat_p95_min: 70
      threat_mean_min: 40
      neg_ratio_min: 0.35
      motion_p95_min: 0.15
    threat_exit:
      threat_p95_max: 55
      threat_mean_max: 28
      neg_ratio_max: 0.25
      motion_p95_max: 0.12
  quality_gate:
    min_valid_ratio: 0.30
    min_face_presence_ratio: 0.30
  no_face_timeout_ms: 1500
  low_quality_timeout_ms: 2000
