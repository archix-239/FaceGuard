models:
  emotion_model_path: models/faceguard_convnext.keras
  face_landmarker_path: models/face_landmarker.task

# Taille d'entrée du modèle ConvNeXt (224×224 RGB)
model_input_size: 224

emotion:
  classes:
    - ANGRY
    - CONTEMPT
    - DISGUST
    - FEAR
    - HAPPY
    - NEUTRAL
    - SAD
    - SURPRISE

camera:
  index: 0
  width: 1280
  height: 720

# CLAHE appliqué sur canal L (espace LAB) — préserve la couleur
clahe:
  enabled: true       # false = désactiver CLAHE (utile pour tests A/B)
  clip_limit: 2.0     # seuil de contraste (plus élevé = plus agressif)
  tile_grid_size: [8, 8]  # taille de la grille de tuiles

ui:
  mode: full          # full | off
  window_name: FaceGuard – Emotion Recognition

# GPU — TensorFlow utilise automatiquement le GPU si disponible
gpu:
  enabled: true         # false = forcer CPU même si GPU présent
  memory_growth: true   # alloue la VRAM progressivement (évite les OOM)

inference:
  backend: auto         # auto = keras si GPU, tflite si CPU uniquement
                        # keras  = TF/Keras (GPU ou CPU)
                        # tflite = TFLite CPU (plus léger sans GPU)
  tflite_model_path: models/faceguard_fp32.tflite
  tflite_num_threads: 2
  warmup_runs: 2
  infer_every_ms: 150   # fréquence d'inférence ~6 Hz

work_frame:
  enabled: true
  width: 640
  height: 360

tracking:
  max_faces: 4
  detect_every_ms: 400   # fréquence détection MediaPipe ~2.5 Hz
  max_missed_frames: 15  # frames avant suppression d'une piste perdue
  quality_threshold: 0.3 # score qualité minimum pour lancer l'inférence (0.0–1.0)
